name: RK Daily Gita Lesson (7 AM IST)

on:
  schedule:
    # GitHub Actions cron is NOT exact — often fires 30-90 min late.
    # We fire at 3 times to maximize chance of hitting 7 AM IST:
    - cron: '0 1 * * *'    # 6:30 AM IST (early buffer)
    - cron: '30 1 * * *'   # 7:00 AM IST (target)
    - cron: '0 2 * * *'    # 7:30 AM IST (backup if GA delayed)
    - cron: '30 2 * * *'   # 8:00 AM IST (backup backup)
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: write # For committing gita-progress.json

jobs:
  send-lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send Daily Gita Lesson
        run: python generate_lesson.py

      - name: Commit progress
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add gita-progress.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "📖 Daily Gita lesson progress update"
          git push || true